; lanfix - LAN play fix for C&C3, Kane's Wrath and Red Alert 3
; Put this file next to dsound.dll in the game's executable folder.

[LanFix]
; 1 = fix on. 0 = off (the DLL then only passes sound calls through).
Enabled=1

; Which network adapter the game should use for LAN play.
;   auto       pick the real home-network adapter, skipping VPN and virtual adapters
;              (VirtualBox, Hyper-V, WSL, Docker, NordVPN, WireGuard, ...)
;   a.b.c.d    use the adapter that has this IPv4 address
;   some text  use the first adapter whose name or description contains this text,
;              e.g. ZeroTier or Radmin if you play "LAN" over a virtual network on purpose
Adapter=auto

; Send LAN broadcasts to the chosen adapter's subnet instead of 255.255.255.255.
; Keeps game discovery on your home network while a VPN is connected.
FixBroadcast=1

; If the game tries to use any other IP address - a VPN's, or one this PC no longer has
; (e.g. after the router handed out a new one) - use the chosen adapter's address instead.
FixBind=1

; Write lanfix.log next to the DLL (which adapter was chosen and what was changed).
Log=1
